<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan PHC - Unit Kecemasan & Trauma</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-dark: #0f172a;    /* Deep Executive Navy */
      --accent-blue: #0284c7;
      --accent-green: #16a34a;
      --accent-hover: #15803d;
      --text-muted: #64748b;
      --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.98);
    }

    body {
      background: var(--bg-gradient);
      font-family: 'Inter', sans-serif;
      color: #334155;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    /* Responsive Wrapper - Auto adjusts for PC and Mobile */
    .app-wrapper {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    /* Elegant Card Design */
    .elegant-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(12px);
      padding: 2rem;
      transition: all 0.3s ease;
      margin-bottom: 1.5rem;
    }

    /* Header Nav */
    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    
    .btn-back {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: var(--primary-dark);
      font-weight: 600;
      border-radius: 10px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-back:hover {
      background: #f1f5f9;
      transform: translateX(-2px);
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      color: var(--primary-dark);
    }
    
    .btn-summary {
      background: #e0f2fe;
      border: 1px solid #bae6fd;
      color: var(--accent-blue);
      font-weight: 700;
      border-radius: 10px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-summary:hover {
      background: #bae6fd;
      color: #0369a1;
      transform: translateX(2px);
    }

    .header-title { font-weight: 800; color: var(--primary-dark); font-size: 1.1rem; margin: 0; text-align: center; }

    /* Elegant Input Fields */
    .form-control, .form-select {
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
      color: var(--primary-dark);
      border-radius: 10px;
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .form-control:focus, .form-select:focus {
      background-color: #ffffff;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
    }
    
    .form-label { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.3rem; letter-spacing: 0.5px; text-transform: uppercase; }

    /* Section Title */
    .section-title {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--primary-dark);
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 0.5rem;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
    }

    /* Elegant Buttons */
    .btn-elegant-submit {
      background-color: var(--accent-green);
      color: #ffffff;
      font-weight: 600;
      border-radius: 12px;
      padding: 0.9rem;
      font-size: 0.95rem;
      border: none;
      transition: all 0.3s ease;
    }
    .btn-elegant-submit:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 15px rgba(22, 163, 74, 0.2);
      color: #fff;
    }

    .btn-elegant-reset {
      background-color: #ffffff;
      color: var(--text-muted);
      border: 1px solid #cbd5e1;
      font-weight: 600;
      border-radius: 12px;
      padding: 0.9rem;
      transition: all 0.2s ease;
    }
    .btn-elegant-reset:hover {
      background-color: #f1f5f9;
      color: var(--primary-dark);
    }

    footer {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 500;
    }

    /* Mobile Adjustments */
    @media (max-width: 480px) {
      .elegant-card { padding: 1.5rem; }
      .header-title { font-size: 1rem; }
      .nav-header { flex-direction: column; gap: 10px; }
      .nav-header > div { width: 100%; display: flex; justify-content: space-between; }
      .nav-header h6 { margin-bottom: 10px !important; }
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    
    <!-- HEADER NAV -->
    <div class="nav-header">
      <h6 class="header-title">Borang Laporan PHC</h6>
      <div>
        <a href="index.html" class="btn-back text-decoration-none">
          <i class="fa-solid fa-arrow-left me-1"></i> Utama
        </a>
        <a href="laporanphcsummary.html" class="btn-summary text-decoration-none ms-2">
          <i class="fa-solid fa-list-check me-1"></i> Ringkasan
        </a>
      </div>
    </div>

    <!-- ALERT BOX -->
    <div id="alertBox" class="alert d-none elegant-card text-center fw-bold py-3 mb-3 small" style="padding: 1rem!important; border-radius: 12px;" role="alert"></div>

    <!-- DOWNLOAD SECTION (HIDDEN BY DEFAULT) -->
    <div id="downloadSection" class="elegant-card text-center d-none" style="padding: 1.5rem;">
      <h6 class="text-success fw-bold m-0 mb-3"><i class="fa-solid fa-circle-check me-1"></i> Laporan PHC Berjaya Dihantar!</h6>
      <a id="btnDownloadPDF" href="#" target="_blank" class="btn btn-elegant-submit w-100 m-0 text-decoration-none">
        <i class="fa-solid fa-file-arrow-down me-2"></i> Muat Turun PDF Laporan
      </a>
      <button class="btn btn-link text-muted mt-3 small text-decoration-none" onclick="resetForm()">
        <i class="fa-solid fa-rotate-right me-1"></i> Daftar Kes PHC Baharu
      </button>
    </div>

    <!-- BORANG PHC -->
    <form id="phcForm" onsubmit="event.preventDefault(); submitPHC();">
      
      <div class="elegant-card">
        <div class="section-title">
          <i class="fa-solid fa-headset me-2" style="color: var(--accent-blue);"></i> Section 1: Call Triage / Dispatcher
        </div>
        
        <div class="row g-3">
          <div class="col-sm-6">
            <label class="form-label">MECC HSB</label>
            <input type="text" id="meccHsb" class="form-control" placeholder="Nama Pegawai HSB" required>
          </div>
          <div class="col-sm-6">
            <label class="form-label">Call Card Number</label>
            <input type="text" id="callCardNumber" class="form-control" placeholder="Cth: C123456" required>
          </div>
          <div class="col-sm-6">
            <label class="form-label">Priority Case</label>
            <select id="priorityCase" class="form-select" required>
              <option value="" selected disabled>Pilih Keutamaan...</option>
              <option value="P1">P1 (Kritikal)</option>
              <option value="P2">P2 (Semi Kritikal)</option>
              <option value="P3">P3 (Bukan Kritikal)</option>
              <option value="P4">P4 (Lain-Lain)</option>
            </select>
          </div>
          <div class="col-sm-6">
            <label class="form-label">Case Type</label>
            <input type="text" id="caseType" class="form-control" placeholder="Trauma / Medical" required>
          </div>
          <div class="col-sm-6">
            <label class="form-label">Caller Name</label>
            <input type="text" id="callerName" class="form-control" placeholder="Nama Pemanggil" required>
          </div>
          <div class="col-sm-6">
            <label class="form-label">Caller Phone</label>
            <input type="tel" id="callerPhone" class="form-control" placeholder="No. Tel Pemanggil" required>
          </div>
          <div class="col-sm-12">
            <label class="form-label">Total Patient</label>
            <input type="number" id="totalPatient" class="form-control" value="1" min="1" required>
          </div>
          <div class="col-sm-12">
            <label class="form-label">Address / Location</label>
            <textarea id="addressLocation" class="form-control" rows="2" placeholder="Alamat penuh kejadian" required></textarea>
          </div>
          <div class="col-sm-12">
            <label class="form-label">Landmark</label>
            <input type="text" id="landmark" class="form-control" placeholder="Mercu tanda berdekatan">
          </div>
          <div class="col-sm-12">
            <label class="form-label">PPP Call Triage / Dispatcher</label>
            <input type="text" id="pppCallTriage" class="form-control" placeholder="Nama PPP Bertugas" required>
          </div>
        </div>
      </div>

      <div class="elegant-card">
        <div class="section-title">
          <i class="fa-solid fa-truck-medical me-2" style="color: var(--accent-green);"></i> Section 2: Responder / PHC Team
        </div>
        
        <div class="row g-3">
          <div class="col-sm-6">
            <label class="form-label">PPP Responder Name</label>
            <input type="text" id="pppResponder" class="form-control" placeholder="Nama PPP Responder" required>
          </div>
          <div class="col-sm-6">
            <label class="form-label">Ambulance Driver</label>
            <input type="text" id="ambulanceDriver" class="form-control" placeholder="Nama Pemandu" required>
          </div>
          <div class="col-sm-4 col-6">
            <label class="form-label">Depart Time</label>
            <input type="time" id="departTime" class="form-control" required>
          </div>
          <div class="col-sm-4 col-6">
            <label class="form-label">En Route</label>
            <input type="time" id="enRouteTime" class="form-control">
          </div>
          <div class="col-sm-4 col-6">
            <label class="form-label">At Scene</label>
            <input type="time" id="atSceneTime" class="form-control">
          </div>
          <div class="col-sm-4 col-6">
            <label class="form-label">At Patient</label>
            <input type="time" id="atPatientTime" class="form-control">
          </div>
          <div class="col-sm-4 col-6">
            <label class="form-label">Transport</label>
            <input type="time" id="transportTime" class="form-control">
          </div>
          <div class="col-sm-4 col-6">
            <label class="form-label">Arrival Hospital</label>
            <input type="time" id="arrivalHospitalTime" class="form-control">
          </div>
          <div class="col-sm-12">
            <label class="form-label text-danger">Total Distance (KM)</label>
            <input type="number" id="totalDistance" class="form-control border-danger" step="0.1" value="0" required>
          </div>
          <div class="col-sm-12">
            <label class="form-label">Remarks</label>
            <textarea id="remarks" class="form-control" rows="2" placeholder="Catatan tambahan kejadian..."></textarea>
          </div>
        </div>

        <div class="row g-2 mt-3">
          <div class="col-8">
            <button type="submit" id="btnSubmit" class="btn-elegant-submit w-100">
              <i class="fa-solid fa-paper-plane me-2"></i> Submit & Jana PDF
            </button>
          </div>
          <div class="col-4">
            <button type="reset" class="btn-elegant-reset w-100" onclick="resetForm()">
              Reset
            </button>
          </div>
        </div>
      </div>
    </form>

  </div>

 <!-- FOOTER PROFESIONAL -->
  <style>
    .pro-footer {
      margin-top: 2.5rem;
      padding: 1.2rem 0;
      border-top: 1px solid #e2e8f0;
      text-align: center;
      background: transparent;
    }
    .pro-footer p {
      margin: 0;
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    .pro-footer .author {
      font-weight: 700;
      color: #0f172a; /* Warna gelap profesional */
    }
    .pro-footer .divider {
      margin: 0 0.6rem;
      color: #cbd5e1;
    }
    .pro-footer .rights {
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 1.2px;
      color: #94a3b8;
    }
  </style>

  <footer class="pro-footer">
    <div class="container">
      <p>
        &copy; 2026 <span class="author">Yassin Razak MD</span> 
        <span class="divider">|</span> 
        <span class="rights">All Rights Reserved</span>
      </p>
    </div>
  </footer>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx21hpI88izcRUUIaq77sVTSQoTmG3riExl8azhaYf2jk0p3qyc2KSSDe5uNbv3SX8XPg/exec";
    let currentUser = null;

    window.onload = function() {
      const user = localStorage.getItem('currentUser');
      if (!user) {
        window.location.href = "index.html";
      } else {
        currentUser = JSON.parse(user);
      }
    };

    function playSuccessSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.frequency.setValueAtTime(523.25, ctx.currentTime);
        gain1.gain.setValueAtTime(0.15, ctx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        osc1.connect(gain1); gain1.connect(ctx.destination);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.frequency.setValueAtTime(783.99, ctx.currentTime + 0.12);
        gain2.gain.setValueAtTime(0.2, ctx.currentTime + 0.12);
        gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        osc2.connect(gain2); gain2.connect(ctx.destination);

        osc1.start(ctx.currentTime); osc1.stop(ctx.currentTime + 0.15);
        osc2.start(ctx.currentTime + 0.12); osc2.stop(ctx.currentTime + 0.4);
      } catch (e) {}
    }

    function showAlert(msg, type) {
      const box = document.getElementById('alertBox');
      const bg = type === 'success' ? '#dcfce7' : '#fee2e2';
      const color = type === 'success' ? '#16a34a' : '#dc2626';
      
      box.style.backgroundColor = bg;
      box.style.color = color;
      box.style.borderColor = color;
      box.innerText = msg;
      box.classList.remove('d-none');
    }

    function resetForm() {
      document.getElementById('phcForm').reset();
      document.getElementById('downloadSection').classList.add('d-none');
      document.getElementById('phcForm').classList.remove('d-none');
      document.getElementById('alertBox').classList.add('d-none');
      window.scrollTo(0, 0);
    }

    async function submitPHC() {
      document.getElementById('btnSubmit').disabled = true;
      document.getElementById('btnSubmit').innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Memproses & Menjana PDF...';

      const payload = {
        action: 'submitPHC',
        currentUser: currentUser,
        data: {
          meccHsb: document.getElementById('meccHsb').value,
          callCardNumber: document.getElementById('callCardNumber').value,
          priorityCase: document.getElementById('priorityCase').value,
          caseType: document.getElementById('caseType').value,
          callerName: document.getElementById('callerName').value,
          callerPhone: document.getElementById('callerPhone').value,
          totalPatient: document.getElementById('totalPatient').value,
          addressLocation: document.getElementById('addressLocation').value,
          landmark: document.getElementById('landmark').value,
          pppCallTriage: document.getElementById('pppCallTriage').value,
          pppResponder: document.getElementById('pppResponder').value,
          ambulanceDriver: document.getElementById('ambulanceDriver').value,
          departTime: document.getElementById('departTime').value,
          enRouteTime: document.getElementById('enRouteTime').value,
          atSceneTime: document.getElementById('atSceneTime').value,
          atPatientTime: document.getElementById('atPatientTime').value,
          transportTime: document.getElementById('transportTime').value,
          arrivalHospitalTime: document.getElementById('arrivalHospitalTime').value,
          totalDistance: document.getElementById('totalDistance').value,
          remarks: document.getElementById('remarks').value
        }
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const responseText = await res.text();
        if (responseText.trim().startsWith("<")) {
          throw new Error("Penyedia Backend mengembalikan maklum balas HTML. Sila semak pautan Apps Script.");
        }

        const data = JSON.parse(responseText);
        
        document.getElementById('btnSubmit').disabled = false;
        document.getElementById('btnSubmit').innerHTML = '<i class="fa-solid fa-paper-plane me-2"></i> Submit & Jana PDF';

        if (data.success) {
          showAlert(data.message, 'success');
          playSuccessSound();
          
          if (data.pdfDownloadUrl || data.pdfUrl) {
            document.getElementById('btnDownloadPDF').href = data.pdfDownloadUrl || data.pdfUrl;
            document.getElementById('phcForm').classList.add('d-none');
            document.getElementById('downloadSection').classList.remove('d-none');
            window.scrollTo(0, 0);
          }
        } else {
          showAlert(data.message, 'danger');
        }
      } catch (err) {
        showAlert('Ralat API: ' + err.message, 'danger');
        document.getElementById('btnSubmit').disabled = false;
        document.getElementById('btnSubmit').innerHTML = '<i class="fa-solid fa-paper-plane me-2"></i> Submit & Jana PDF';
      }
    }
  </script>
</body>
</html>
