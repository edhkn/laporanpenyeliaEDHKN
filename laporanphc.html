<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan PHC - Unit Kecemasan & Trauma</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-color: #0f172a;
      --accent-green: #16a34a;
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
    }

    body {
      background: var(--bg-gradient);
      font-family: 'Inter', sans-serif;
      color: #334155;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .modern-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; }
    .form-control { background-color: #f8fafc; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.88rem; }
    .btn-phc { background-color: var(--accent-green); border: none; color: #fff; font-weight: 600; border-radius: 6px; }

    footer { border-top: 1px solid var(--border-color); background: #ffffff; font-size: 0.75rem; color: #64748b; }
  </style>
</head>
<body>

  <div class="container py-2 px-3" style="max-width: 420px;">
    
    <!-- HEADER -->
    <div class="d-flex align-items-center justify-content-between mb-2">
      <a href="index.html" class="btn btn-sm btn-outline-secondary py-0 px-2" style="font-size:0.75rem;"><i class="fa-solid fa-arrow-left me-1"></i> Kembali</a>
      <div class="text-end">
        <h6 class="fw-bold m-0 text-dark">Laporan PHC (Ambulan)</h6>
        <small id="userDisplay" class="text-muted" style="font-size:0.7rem;"></small>
      </div>
    </div>

    <!-- ALERT BOX -->
    <div id="alertBox" class="alert d-none modern-card text-center fw-bold py-2 px-3 mb-2 small" role="alert"></div>

    <!-- FORM PHC -->
    <div class="modern-card p-3">
      <h6 class="mb-2 fw-bold text-dark border-bottom pb-1" style="font-size:0.8rem;">
        <i class="fa-solid fa-truck-medical me-1 text-success"></i>Butiran Panggilan PHC
      </h6>

      <div class="mb-2">
        <label class="fw-bold text-dark mb-1" style="font-size:0.75rem;">Bilangan Panggilan Ambulan:</label>
        <input type="number" id="totalCalls" class="form-control" value="0" min="0">
      </div>

      <div class="mb-2">
        <label class="fw-bold text-dark mb-1" style="font-size:0.75rem;">Lokasi / Kes Utama:</label>
        <input type="text" id="lokasiKes" class="form-control" placeholder="Contoh: Kes Kemalangan Jalan Raya Jalan Naka">
      </div>

      <div class="mb-2">
        <label class="fw-bold text-dark mb-1" style="font-size:0.75rem;">Status Ambulan & Peralatan:</label>
        <textarea id="statusPeralatan" class="form-control" rows="2" placeholder="Catat status kelengkapan dan kenderaan..."></textarea>
      </div>

      <button id="btnSubmitPHC" class="btn btn-phc w-100 py-2 mt-1" onclick="submitPHC()">
        <i class="fa-solid fa-paper-plane me-1"></i>Hantar Laporan PHC
      </button>
    </div>

  </div>

  <footer class="text-center py-2 mt-2">
    <div class="container"><span>© 2026 Yassin Razak | All Rights Reserved</span></div>
  </footer>

  <script>
    let currentUser = null;

    window.onload = function() {
      const user = localStorage.getItem('currentUser');
      if (!user) {
        window.location.href = "index.html";
      } else {
        currentUser = JSON.parse(user);
        document.getElementById('userDisplay').innerText = currentUser.nama;
      }
    };

    function submitPHC() {
      alert("Modul Laporan PHC Berjaya Dihantar!");
    }
  </script>
</body>
</html>
