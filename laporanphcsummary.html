<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ringkasan Laporan PHC - Unit Kecemasan & Trauma</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-dark: #0f172a;    /* Deep Executive Navy */
      --accent-blue: #0284c7;
      --text-muted: #64748b;
      --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.98);
    }

    body {
      background: var(--bg-gradient);
      font-family: 'Inter', sans-serif;
      color: #334155;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    /* Responsive Wrapper */
    .app-wrapper {
      width: 100%;
      max-width: 750px; /* Slightly wider for the data table */
      margin: auto;
    }

    /* Elegant Card Design */
    .elegant-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(12px);
      padding: 1.5rem 2rem;
      transition: all 0.3s ease;
      margin-bottom: 1.5rem;
    }

    /* Header Nav */
    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    
    .btn-back {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: var(--primary-dark);
      font-weight: 600;
      border-radius: 10px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-back:hover {
      background: #f1f5f9;
      transform: translateX(-2px);
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      color: var(--primary-dark);
    }

    .header-title { font-weight: 800; color: var(--primary-dark); font-size: 1.1rem; margin: 0; }

    /* Elegant Select Filter */
    .filter-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      border-radius: 12px;
      padding: 0.8rem 1.2rem;
      border: 1px solid #e2e8f0;
    }
    
    .filter-label {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--primary-dark);
      margin: 0;
      display: flex;
      align-items: center;
    }

    .form-select {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      color: var(--primary-dark);
      border-radius: 8px;
      padding: 0.4rem 2rem 0.4rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      width: auto;
      min-width: 180px;
      cursor: pointer;
    }
    .form-select:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    /* Elegant Table */
    .table-container {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
    }
    .table { margin: 0; font-size: 0.85rem; }
    .table thead { background-color: #f8fafc; }
    .table th {
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
      padding: 1rem;
      border-bottom: 2px solid #e2e8f0;
    }
    .table td {
      padding: 1rem;
      vertical-align: middle;
      color: var(--primary-dark);
      border-bottom: 1px solid #f1f5f9;
    }
    .table tbody tr:hover { background-color: #f8fafc; }

    /* Badges */
    .badge { padding: 0.35em 0.6em; border-radius: 6px; font-weight: 700; font-size: 0.7rem; }
    .badge-p1 { background-color: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; }
    .badge-p2 { background-color: #fffbeb; color: #d97706; border: 1px solid #fcd34d; }
    .badge-p3 { background-color: #f0fdf4; color: #16a34a; border: 1px solid #86efac; }
    .badge-p4 { background-color: #f8fafc; color: #64748b; border: 1px solid #cbd5e1; }

    .btn-pdf {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fca5a5;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    .btn-pdf:hover {
      background: #dc2626;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 6px rgba(220, 38, 38, 0.2);
    }

    footer { margin-top: 1rem; text-align: center; font-size: 0.8rem; color: #94a3b8; font-weight: 500; }

    /* Mobile Optimization */
    @media (max-width: 576px) {
      .elegant-card { padding: 1.25rem; }
      .filter-wrapper { flex-direction: column; align-items: flex-start; gap: 10px; }
      .form-select { width: 100%; }
      .table th, .table td { padding: 0.75rem 0.5rem; font-size: 0.8rem; }
      .btn-pdf { padding: 0.3rem 0.6rem; font-size: 0.75rem; }
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    
    <!-- HEADER NAV -->
    <div class="nav-header">
      <a href="index.html" class="btn-back text-decoration-none">
        <i class="fa-solid fa-arrow-left me-1"></i> Utama
      </a>
      <h6 class="header-title">Ringkasan Laporan PHC</h6>
    </div>

    <!-- FILTER SECTION -->
    <div class="elegant-card p-3">
      <div class="filter-wrapper">
        <p class="filter-label"><i class="fa-solid fa-filter me-2 text-primary"></i> Penapis Rekod:</p>
        <select id="dateRangeSelect" class="form-select" onchange="loadSummary()">
          <option value="">10 Kes Terkini</option>
          <option value="today">Hari Ini</option>
          <option value="7days">7 Hari Terakhir</option>
          <option value="30days">30 Hari Terakhir</option>
          <option value="all">Semua Rekod</option>
        </select>
      </div>
    </div>

    <!-- TABLE SECTION -->
    <div class="elegant-card p-0 overflow-hidden">
      <div class="table-container table-responsive">
        <table class="table table-hover align-middle m-0">
          <thead>
            <tr>
              <th>Tarikh & Masa</th>
              <th>Kad / Jenis Kes</th>
              <th>Penyelia PHC</th>
              <th class="text-center">Tindakan</th>
            </tr>
          </thead>
          <tbody id="summaryTableBody">
            <tr>
              <td colspan="4" class="text-center py-5 text-muted">
                <i class="fa-solid fa-spinner fa-spin fa-2x mb-3 text-primary"></i><br>
                <span class="fw-semibold">Menarik rekod pelayan...</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <footer>
    <div class="container">
      © 2026 Yassin Razak | All Rights Reserved
    </div>
  </footer>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx21hpI88izcRUUIaq77sVTSQoTmG3riExl8azhaYf2jk0p3qyc2KSSDe5uNbv3SX8XPg/exec";

    window.onload = function() {
      // Pastikan pengguna telah log masuk untuk melihat rekod
      const user = localStorage.getItem('currentUser');
      if (!user) {
        window.location.href = "index.html";
        return;
      }
      loadSummary();
    };

    async function loadSummary() {
      const range = document.getElementById('dateRangeSelect').value;
      const tbody = document.getElementById('summaryTableBody');
      tbody.innerHTML = `<tr><td colspan="4" class="text-center py-5 text-muted"><i class="fa-solid fa-spinner fa-spin fa-2x mb-3 text-primary"></i><br><span class="fw-semibold">Memproses carian rekod...</span></td></tr>`;

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'getPHCSummary', dateRange: range })
        });

        const data = await res.json();
        
        if (data.success && data.list.length > 0) {
          tbody.innerHTML = '';
          data.list.forEach(item => {
            let badgeClass = 'badge-p4';
            if (item.priority === 'P1') badgeClass = 'badge-p1';
            if (item.priority === 'P2') badgeClass = 'badge-p2';
            if (item.priority === 'P3') badgeClass = 'badge-p3';

            tbody.innerHTML += `
              <tr>
                <td class="fw-semibold text-muted" style="font-size: 0.8rem;">${item.tarikh}</td>
                <td>
                  <span class="badge ${badgeClass} mb-1">${item.priority}</span> 
                  <span class="fw-bold d-inline-block ms-1">${item.callCard}</span><br>
                  <span class="text-muted" style="font-size: 0.75rem;">${item.caseType}</span>
                </td>
                <td class="fw-medium">${item.pppResponder}</td>
                <td class="text-center">
                  <a href="${item.pdfUrl}" target="_blank" class="btn btn-pdf text-decoration-none" title="Muat Turun PDF">
                    <i class="fa-solid fa-file-pdf"></i>
                  </a>
                </td>
              </tr>
            `;
          });
        } else {
          tbody.innerHTML = '<tr><td colspan="4" class="text-center py-5 text-muted fw-medium"><i class="fa-solid fa-folder-open mb-2 fa-2x opacity-50"></i><br>Tiada rekod ditemui untuk julat tarikh ini.</td></tr>';
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-danger fw-semibold"><i class="fa-solid fa-circle-exclamation me-2"></i>Ralat menyambung ke pangkalan data. Sila muat semula halaman.</td></tr>`;
      }
    }
  </script>
</body>
</html>
