<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Penyeliaan - Unit Kecemasan & Trauma</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-color: #0f172a;
      --accent-blue: #0284c7;
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
    }

    body {
      background: var(--bg-gradient);
      font-family: 'Inter', sans-serif;
      color: #334155;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .modern-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; }
    .logo-img { width: 60px; height: auto; }
    .form-control { background-color: #f8fafc; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.88rem; }
    .btn-modern-primary { background-color: var(--accent-blue); border: none; color: #fff; font-weight: 600; border-radius: 6px; }

    footer { border-top: 1px solid var(--border-color); background: #ffffff; font-size: 0.75rem; color: #64748b; }
  </style>
</head>
<body>

  <div class="container py-2 px-3" style="max-width: 420px;">
    
    <!-- HEADER -->
    <div class="d-flex align-items-center justify-content-between mb-2">
      <a href="index.html" class="btn btn-sm btn-outline-secondary py-0 px-2" style="font-size:0.75rem;"><i class="fa-solid fa-arrow-left me-1"></i> Kembali</a>
      <div class="text-end">
        <h6 class="fw-bold m-0 text-dark">Laporan Penyeliaan</h6>
        <small id="userDisplay" class="text-muted" style="font-size:0.7rem;"></small>
      </div>
    </div>

    <!-- ALERT BOX -->
    <div id="alertBox" class="alert d-none modern-card text-center fw-bold py-2 px-3 mb-2 small" role="alert"></div>

    <!-- FORM -->
    <div class="modern-card p-3">
      <h6 class="mb-2 fw-bold text-dark border-bottom pb-1" style="font-size:0.8rem;">
        <i class="fa-solid fa-hospital-user me-1 text-primary"></i>Bilangan Pesakit
      </h6>
      
      <div class="row g-2 mb-2">
        <div class="col-6">
          <label class="fw-bold text-danger" style="font-size:0.75rem;">🔴 Red Zone</label>
          <input type="number" id="redZone" class="form-control" value="0" min="0">
        </div>
        <div class="col-6">
          <label class="fw-bold text-warning" style="font-size:0.75rem;">🟡 Yellow Zone</label>
          <input type="number" id="yellowZone" class="form-control" value="0" min="0">
        </div>
        <div class="col-6">
          <label class="fw-bold text-success" style="font-size:0.75rem;">🟢 Green Zone</label>
          <input type="number" id="greenZone" class="form-control" value="0" min="0">
        </div>
        <div class="col-6">
          <label class="fw-bold text-info" style="font-size:0.75rem;">🫁 Asthma Bay</label>
          <input type="number" id="asthmaBay" class="form-control" value="0" min="0">
        </div>
        <div class="col-6">
          <label class="fw-bold text-dark" style="font-size:0.75rem;">🛋️ Obs Bay</label>
          <input type="number" id="observationBay" class="form-control" value="0" min="0">
        </div>
        <div class="col-6">
          <label class="fw-bold text-secondary" style="font-size:0.75rem;">⏳ Awaiting Adm.</label>
          <input type="number" id="awaitingAdmission" class="form-control" value="0" min="0">
        </div>
      </div>

      <div class="mb-2">
        <label class="fw-bold text-dark mb-1" style="font-size:0.75rem;"><i class="fa-solid fa-triangle-exclamation text-warning me-1"></i> Isu / Masalah Berbangkit:</label>
        <textarea id="inputMasalah" class="form-control" rows="2" placeholder="Taip rincian masalah jika ada..."></textarea>
      </div>

      <div class="mb-2">
        <label class="fw-bold text-dark mb-1" style="font-size:0.75rem;"><i class="fa-solid fa-list-check text-success me-1"></i> Tindakan (Jika Perlu):</label>
        <textarea id="inputTindakan" class="form-control" rows="2" placeholder="Taip tindakan susulan jika perlu..."></textarea>
      </div>

      <button id="btnSubmit" class="btn btn-modern-primary w-100 py-2 mt-1" onclick="submitReport()">
        <i class="fa-solid fa-file-pdf me-1"></i>Jana PDF & Hantar E-Mel
      </button>
    </div>

  </div>

  <footer class="text-center py-2 mt-2">
    <div class="container"><span>© 2026 Yassin Razak | All Rights Reserved</span></div>
  </footer>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx21hpI88izcRUUIaq77sVTSQoTmG3riExl8azhaYf2jk0p3qyc2KSSDe5uNbv3SX8XPg/exec";
    let currentUser = null;

    // Semak Akses Log Masuk
    window.onload = function() {
      const user = localStorage.getItem('currentUser');
      if (!user) {
        window.location.href = "index.html";
      } else {
        currentUser = JSON.parse(user);
        document.getElementById('userDisplay').innerText = currentUser.nama;
      }
    };

    function playSuccessSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.frequency.setValueAtTime(523.25, ctx.currentTime);
        gain1.gain.setValueAtTime(0.15, ctx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        osc1.connect(gain1); gain1.connect(ctx.destination);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.frequency.setValueAtTime(783.99, ctx.currentTime + 0.12);
        gain2.gain.setValueAtTime(0.2, ctx.currentTime + 0.12);
        gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        osc2.connect(gain2); gain2.connect(ctx.destination);

        osc1.start(ctx.currentTime); osc1.stop(ctx.currentTime + 0.15);
        osc2.start(ctx.currentTime + 0.12); osc2.stop(ctx.currentTime + 0.4);
      } catch (e) {}
    }

    function showAlert(msg, type) {
      const box = document.getElementById('alertBox');
      box.className = `alert alert-${type === 'success' ? 'success' : 'danger'} modern-card text-center fw-bold py-2 px-3 mb-2 small`;
      box.innerText = msg;
      box.classList.remove('d-none');
    }

    async function submitReport() {
      document.getElementById('btnSubmit').disabled = true;
      document.getElementById('btnSubmit').innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> Menjana PDF...';

      const payload = {
        action: 'submitReport',
        currentUser: currentUser,
        data: {
          redZone: document.getElementById('redZone').value || 0,
          yellowZone: document.getElementById('yellowZone').value || 0,
          greenZone: document.getElementById('greenZone').value || 0,
          asthmaBay: document.getElementById('asthmaBay').value || 0,
          observationBay: document.getElementById('observationBay').value || 0,
          awaitingAdmission: document.getElementById('awaitingAdmission').value || 0,
          masalah: document.getElementById('inputMasalah').value.trim(),
          tindakan: document.getElementById('inputTindakan').value.trim()
        }
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        document.getElementById('btnSubmit').disabled = false;
        document.getElementById('btnSubmit').innerHTML = '<i class="fa-solid fa-file-pdf me-1"></i>Jana PDF & Hantar E-Mel';

        if (data.success) {
          showAlert(data.message, 'success');
          playSuccessSound();
        } else {
          showAlert(data.message, 'danger');
        }
      } catch (err) {
        showAlert('Ralat API: ' + err.message, 'danger');
        document.getElementById('btnSubmit').disabled = false;
        document.getElementById('btnSubmit').innerHTML = '<i class="fa-solid fa-file-pdf me-1"></i>Jana PDF & Hantar E-Mel';
      }
    }
  </script>
</body>
</html>
