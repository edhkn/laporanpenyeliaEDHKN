<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Penyeliaan - Unit Kecemasan & Trauma</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-dark: #0f172a;    /* Deep Executive Navy */
      --accent-blue: #0284c7;
      --accent-hover: #0369a1;
      --text-muted: #64748b;
      --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.98);
    }

    body {
      background: var(--bg-gradient);
      font-family: 'Inter', sans-serif;
      color: #334155;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    /* Responsive Wrapper - Auto adjusts for PC and Mobile */
    .app-wrapper {
      width: 100%;
      max-width: 600px; /* Slightly wider for form inputs */
      margin: auto;
    }

    /* Elegant Card Design */
    .elegant-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(12px);
      padding: 2rem;
      transition: all 0.3s ease;
    }

    /* Header Nav */
    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    
    .btn-back {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: var(--primary-dark);
      font-weight: 600;
      border-radius: 10px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .btn-back:hover {
      background: #f1f5f9;
      transform: translateX(-2px);
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .header-title { font-weight: 800; color: var(--primary-dark); font-size: 1.1rem; margin: 0; }
    .header-subtitle { font-weight: 600; color: var(--accent-blue); font-size: 0.75rem; text-transform: uppercase; }

    /* Elegant Input Fields */
    .form-control {
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
      color: var(--primary-dark);
      border-radius: 10px;
      padding: 0.6rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .form-control:focus {
      background-color: #ffffff;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
    }
    
    .form-label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.3rem; letter-spacing: 0.5px; text-transform: uppercase; }
    
    /* Input Group Icons */
    .input-group-text {
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-right: none;
      border-radius: 10px 0 0 10px;
    }
    .form-control.with-icon { border-left: none; border-radius: 0 10px 10px 0; }
    .form-control.with-icon:focus { border-left: 1px solid var(--accent-blue); }

    /* Section Title */
    .section-title {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--primary-dark);
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 0.5rem;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
    }

    /* Elegant Buttons */
    .btn-elegant-primary {
      background-color: var(--primary-dark);
      color: #ffffff;
      font-weight: 600;
      border-radius: 12px;
      padding: 0.9rem;
      font-size: 0.95rem;
      border: none;
      transition: all 0.3s ease;
      margin-top: 1rem;
    }
    .btn-elegant-primary:hover {
      background-color: #1e293b;
      transform: translateY(-2px);
      box-shadow: 0 8px 15px rgba(15, 23, 42, 0.15);
      color: #fff;
    }

    footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 500;
    }

    /* Mobile Adjustments */
    @media (max-width: 480px) {
      .elegant-card { padding: 1.5rem; }
      .header-title { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    
    <!-- HEADER NAV -->
    <div class="nav-header">
      <a href="index.html" class="btn-back text-decoration-none">
        <i class="fa-solid fa-arrow-left me-1"></i> Utama
      </a>
      <div class="text-end">
        <h6 class="header-title">Laporan Penyeliaan</h6>
        <div id="userDisplay" class="header-subtitle">Memuatkan sesi...</div>
      </div>
    </div>

    <!-- ALERT BOX -->
    <div id="alertBox" class="alert d-none elegant-card text-center fw-bold py-3 mb-3 small" style="padding: 1rem!important; border-radius: 12px;" role="alert"></div>

    <!-- FORM SECTION -->
    <div class="elegant-card">
      <div class="section-title">
        <i class="fa-solid fa-hospital-user me-2" style="color: var(--accent-blue);"></i> Bilangan Pesakit Semasa
      </div>
      
      <div class="row g-3 mb-4">
        <div class="col-6">
          <label class="form-label text-danger">🔴 Red Zone</label>
          <input type="number" id="redZone" class="form-control" value="0" min="0">
        </div>
        <div class="col-6">
          <label class="form-label" style="color: #d97706;">🟡 Yellow Zone</label>
          <input type="number" id="yellowZone" class="form-control" value="0" min="0">
        </div>
        <div class="col-6">
          <label class="form-label text-success">🟢 Green Zone</label>
          <input type="number" id="greenZone" class="form-control" value="0" min="0">
        </div>
        <div class="col-6">
          <label class="form-label text-info">🫁 Asthma Bay</label>
          <input type="number" id="asthmaBay" class="form-control" value="0" min="0">
        </div>
        <div class="col-6">
          <label class="form-label" style="color: var(--primary-dark);">🛋️ Obs Bay</label>
          <input type="number" id="observationBay" class="form-control" value="0" min="0">
        </div>
        <div class="col-6">
          <label class="form-label text-secondary">⏳ Awaiting Adm.</label>
          <input type="number" id="awaitingAdmission" class="form-control" value="0" min="0">
        </div>
      </div>

      <div class="section-title mt-2">
        <i class="fa-solid fa-clipboard-list me-2" style="color: var(--accent-blue);"></i> Ulasan & Tindakan
      </div>

      <div class="mb-3">
        <label class="form-label"><i class="fa-solid fa-triangle-exclamation text-warning me-1"></i> Isu / Masalah Berbangkit:</label>
        <textarea id="inputMasalah" class="form-control" rows="2" placeholder="Taipkan rincian masalah jika ada..."></textarea>
      </div>

      <div class="mb-2">
        <label class="form-label"><i class="fa-solid fa-list-check text-success me-1"></i> Tindakan Susulan (Jika Perlu):</label>
        <textarea id="inputTindakan" class="form-control" rows="2" placeholder="Taipkan tindakan yang telah diambil..."></textarea>
      </div>

      <button id="btnSubmit" class="btn-elegant-primary w-100" onclick="submitReport()">
        <i class="fa-solid fa-file-pdf me-2"></i>Jana PDF & Hantar E-Mel
      </button>
    </div>

  </div>

  <footer>
    <div class="container">
      © 2026 Yassin Razak | All Rights Reserved
    </div>
  </footer>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx21hpI88izcRUUIaq77sVTSQoTmG3riExl8azhaYf2jk0p3qyc2KSSDe5uNbv3SX8XPg/exec";
    let currentUser = null;

    // Semak Akses Log Masuk
    window.onload = function() {
      const user = localStorage.getItem('currentUser');
      if (!user) {
        window.location.href = "index.html";
      } else {
        currentUser = JSON.parse(user);
        document.getElementById('userDisplay').innerText = currentUser.nama;
      }
    };

    function playSuccessSound() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.frequency.setValueAtTime(523.25, ctx.currentTime);
        gain1.gain.setValueAtTime(0.15, ctx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        osc1.connect(gain1); gain1.connect(ctx.destination);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.frequency.setValueAtTime(783.99, ctx.currentTime + 0.12);
        gain2.gain.setValueAtTime(0.2, ctx.currentTime + 0.12);
        gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        osc2.connect(gain2); gain2.connect(ctx.destination);

        osc1.start(ctx.currentTime); osc1.stop(ctx.currentTime + 0.15);
        osc2.start(ctx.currentTime + 0.12); osc2.stop(ctx.currentTime + 0.4);
      } catch (e) {}
    }

    function showAlert(msg, type) {
      const box = document.getElementById('alertBox');
      const bg = type === 'success' ? '#dcfce7' : '#fee2e2';
      const color = type === 'success' ? '#16a34a' : '#dc2626';
      
      box.style.backgroundColor = bg;
      box.style.color = color;
      box.style.borderColor = color;
      box.innerText = msg;
      box.classList.remove('d-none');
    }

    async function submitReport() {
      document.getElementById('btnSubmit').disabled = true;
      document.getElementById('btnSubmit').innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i> Menjana Dokumen...';

      const payload = {
        action: 'submitReport',
        currentUser: currentUser,
        data: {
          redZone: document.getElementById('redZone').value || 0,
          yellowZone: document.getElementById('yellowZone').value || 0,
          greenZone: document.getElementById('greenZone').value || 0,
          asthmaBay: document.getElementById('asthmaBay').value || 0,
          observationBay: document.getElementById('observationBay').value || 0,
          awaitingAdmission: document.getElementById('awaitingAdmission').value || 0,
          masalah: document.getElementById('inputMasalah').value.trim(),
          tindakan: document.getElementById('inputTindakan').value.trim()
        }
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const responseText = await res.text();
        
        if (responseText.trim().startsWith("<")) {
          throw new Error("Penyedia Backend mengembalikan maklum balas HTML. Sila semak Apps Script.");
        }

        const data = JSON.parse(responseText);
        
        document.getElementById('btnSubmit').disabled = false;
        document.getElementById('btnSubmit').innerHTML = '<i class="fa-solid fa-file-pdf me-2"></i>Jana PDF & Hantar E-Mel';

        if (data.success) {
          showAlert(data.message, 'success');
          playSuccessSound();
        } else {
          showAlert(data.message, 'danger');
        }
      } catch (err) {
        showAlert('Ralat API: ' + err.message, 'danger');
        document.getElementById('btnSubmit').disabled = false;
        document.getElementById('btnSubmit').innerHTML = '<i class="fa-solid fa-file-pdf me-2"></i>Jana PDF & Hantar E-Mel';
      }
    }
  </script>
</body>
</html>
